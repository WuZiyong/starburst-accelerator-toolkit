[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accelerator-toolkit"
version = "0.1.0"
description = "Portable accelerator runtime, validation, and scheduler tooling for CUDA, Hygon DCU/DTK, and HPC training."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.scripts]
accel = "accelerator_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["accelerator_toolkit*"]
